# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-test
          - release-rc
          - release-alpha
          - publish-tag
          - monthly-maintenance
      release_version_override:
        description: "Optional explicit release version (for example 2.4.0 or 2.4.0-rc.2)"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 19 1 * *'
    - cron: '41 19 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write
  packages: write
  security-events: write

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      run_docker_build: ${{ steps.route.outputs.run_docker_build }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          run_docker_build=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/test-* ]]; then
                run_release=true
              fi
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                # Run docker build on PRs modifying relevant files
                run_docker_build=true
                run_code_checks=true # Run checks for all PRs
              fi
              ;;
            release)
              run_release=false
              ;;
            workflow_dispatch)
              run_code_checks=true
              if [[ "${{ inputs.mode }}" == "build" ]]; then
                run_docker_build=true
              fi
              if [[ "${{ inputs.mode }}" == release-* ]]; then
                run_release=false # The release-* mode computes and pushes the tag, then explicitly dispatches the tag release run
              fi
              if [[ "${{ inputs.mode }}" == "publish-tag" ]]; then
                if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/test-* ]]; then
                  run_release=true
                else
                  echo "publish-tag must be dispatched against a release tag ref" >&2
                  exit 1
                fi
              fi
              if [[ "${{ inputs.mode }}" == "monthly-maintenance" ]]; then
                is_monthly=true
              fi
              if [[ "${{ inputs.mode }}" == "lint-fix" ]]; then
                is_nightly=true
              fi
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "17 19 1 * *" ]]; then
                is_monthly=true
              fi
              if [[ "${{ github.event.schedule }}" == "41 19 * * *" ]]; then
                is_nightly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          if [[ "$run_release" == "true" ]]; then
            run_docker_build=true
          fi
          echo "run_docker_build=$run_docker_build" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover capabilities and cost profile
    needs: route
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
      has_packaging: ${{ steps.detect.outputs.has_packaging }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          echo "has_docker=true" >> "$GITHUB_OUTPUT"
          echo "has_packaging=true" >> "$GITHUB_OUTPUT"

      - id: profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "profile=private" >> "$GITHUB_OUTPUT"
          else
            echo "profile=public" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Secret scan
    needs: [route, discover]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell-check:
    name: ShellCheck and config check
    needs: [route, discover]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck and zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - run: |
          shopt -s globstar
          shellcheck **/*.sh
      - run: |
          yes "" | sh -c "$(curl -fsLS get.chezmoi.io)" -- init --no-tty --debug --source=$PWD --apply
      - name: Verify shell configuration parses
        run: |
          for f in ~/.bashrc ~/.bash_profile ~/.bash_login ~/.bash_logout ~/.profile; do
            if [ -f "$f" ]; then
              bash -n "$f"
            fi
          done
          for f in ~/.zshrc ~/.zprofile ~/.zlogin ~/.zlogout ~/.zshenv; do
            if [ -f "$f" ]; then
              zsh -n "$f"
            fi
          done

  docker-build:
    name: Build dev-dotfiles-debian image
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_docker == 'true' && needs.route.outputs.run_docker_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: dotfiles=.
          file: containers/dev-dotfiles-debian/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/dev-dotfiles-debian:ci-${{ github.run_id }}
          load: true
          build-args: |
            DOTFILES_RELEASE=ci-${{ github.run_id }}
            DOTFILES_COMMIT=${{ github.sha }}
      - name: Test Docker image bootstrap logic
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/dev-dotfiles-debian:ci-${{ github.run_id }}"

          echo "Testing Git credential helper ordering..."
          # Git config returns empty strings as empty lines. We want to ensure 'helper =' clears it.
          # The generated config should have an empty line followed by '!gh auth'
          docker run --rm "$IMAGE" /usr/bin/zsh -l -c 'git config --global --get-all credential.https://github.com.helper' | head -n 1 | grep -E '^$'
          docker run --rm "$IMAGE" /usr/bin/zsh -l -c 'git config --global --get-all credential.https://github.com.helper' | grep 'gh auth git-credential'

          echo "Testing fresh named volume initialization..."
          docker volume create test-gh-vol
          docker run --rm -e DEV_BOOTSTRAP_GH_TOKEN=fake_token_123 -v test-gh-vol:/home/user/.config/gh "$IMAGE" bash -c "grep fake_token_123 /home/user/.config/gh/hosts.yml"

          echo "Testing already-initialized volume is not overwritten..."
          docker run --rm -e DEV_BOOTSTRAP_GH_TOKEN=new_token_456 -v test-gh-vol:/home/user/.config/gh "$IMAGE" bash -c "grep fake_token_123 /home/user/.config/gh/hosts.yml && ! grep new_token_456 /home/user/.config/gh/hosts.yml"

          echo "Testing ownership/modes are usable by normal user..."
          docker run --rm -v test-gh-vol:/home/user/.config/gh "$IMAGE" bash -c "touch /home/user/.config/gh/testfile && rm /home/user/.config/gh/testfile"

          echo "Testing host bind path is not chowned..."
          mkdir -p test-bind-dir
          touch test-bind-dir/testfile
          chmod 777 test-bind-dir/testfile
          ORIG_OWNER="$(stat -c %U test-bind-dir/testfile)"
          docker run --rm -v "${PWD}/test-bind-dir:/workspace" "$IMAGE" true
          [ "$(stat -c %U test-bind-dir/testfile)" = "$ORIG_OWNER" ]

  docker-release:
    name: Docker release
    needs: [route, discover, docker-build]
    if: ${{ needs.discover.outputs.has_docker == 'true' && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-dotfiles-debian
          labels: |
            org.opencontainers.image.description=Debian development container with dotfiles
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}},value=${{ inputs.release_version_override }},enable=${{ inputs.release_version_override != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.release_version_override }},enable=${{ inputs.release_version_override != '' }}
            type=semver,pattern=v{{major}},value=${{ inputs.release_version_override }},enable=${{ inputs.release_version_override != '' }}
            type=raw,value=${{ inputs.release_version_override }},enable=${{ inputs.release_version_override != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: dotfiles=.
          file: containers/dev-dotfiles-debian/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            DOTFILES_RELEASE=${{ steps.meta.outputs.version }}
            DOTFILES_COMMIT=${{ github.sha }}

  package-dotfiles:
    name: Package Dotfiles
    needs: [route, discover]
    if: ${{ needs.discover.outputs.has_packaging == 'true' && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply configuration
        run: |
          yes "" | sh -c "$(curl -fsLS get.chezmoi.io)" -- init --no-tty --debug --source=$PWD --apply
      - name: Create archive
        run: |
          ./bin/chezmoi archive --source=$PWD --format zip --output dotfiles.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dotfiles-archive
          path: dotfiles.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub release
    needs: [route, package-dotfiles, docker-release]
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.route.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: dotfiles-*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-test') || contains(github.ref, 'test-') }}
          files: dist-release/dotfiles-archive/dotfiles.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  manual-release-tag:
    name: Prepare manual release tag
    needs: route
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      - uses: arran4/git-tag-inc-action@v1
        with:
          mode: install
      - name: Compute and push tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          # If we have an override, validate and use it.
          override_version="${{ inputs.release_version_override }}"
          if [[ -n "$override_version" ]]; then
            tag="v${override_version#v}"

            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|test)\.[0-9]+)?$ ]]; then
              echo "Invalid release version override format: $tag" >&2
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists!" >&2
              exit 1
            fi

            git tag "$tag"
            git push origin "$tag"
          else
            mode="${{ inputs.mode }}"
            rel_type="${mode#release-}"
            tag="$(git-tag-inc -print-version-only "$rel_type")"

            if [[ -z "$tag" ]]; then
              echo "Failed to compute release tag" >&2
              exit 1
            fi

            echo "Running dot_local/bin/executable_gh-release.sh with argument: $rel_type"
            ./dot_local/bin/executable_gh-release.sh "$rel_type"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch release pipeline on tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$RELEASE_TAG" -f mode=publish-tag
