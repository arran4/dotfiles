name: Docker-in-Docker smoke test

on:
  pull_request:
    paths:
      - 'containers/dev-dotfiles-debian/**'
      - '.github/workflows/dind.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dind-smoke:
    name: Run nested Docker daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: dotfiles=.
          file: containers/dev-dotfiles-debian/Dockerfile
          load: true
          push: false
          tags: dev-dotfiles-dind:${{ github.sha }}
          build-args: |
            DOTFILES_RELEASE=dind-ci
            DOTFILES_COMMIT=${{ github.sha }}
      - name: Verify bundled container runtimes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "dev-dotfiles-dind:${{ github.sha }}" -c '
            set -eu
            command -v podman
            podman --version
            command -v docker
            docker --version
            command -v dockerd
            dockerd --version
          '
      - name: Verify startup runtime-mode guidance
        shell: bash
        run: |
          set -euo pipefail
          output="$(
            docker run --rm               --env DEV_HOME_VOLUME_INIT=1               --env DEV_LAUNCHER_COMMAND=run-dev-docker.sh               --env DEV_OUTER_ENGINE=docker               --env DEV_CONTAINER_NAME=dev-agent-ci-home               --env DEV_PODMAN_SECURITY=off               --env DEV_DIND=0               "dev-dotfiles-dind:${{ github.sha }}"               -c true 2>&1
          )"
          grep -F 'Development container runtime modes:' <<<"$output"
          grep -F 'Podman: podman version ' <<<"$output"
          grep -F 'Docker CLI: Docker version ' <<<"$output"
          grep -F 'Docker daemon: Docker version ' <<<"$output"
          grep -F 'DEV_PODMAN_SECURITY=off' <<<"$output"
          grep -F 'DEV_DIND=0' <<<"$output"
          grep -F 'DEV_DIND_PERSIST=' <<<"$output"
          grep -F 'Nested Podman: disabled by launcher security mode (Podman remains installed)' <<<"$output"
          grep -F 'Docker-in-Docker: disabled' <<<"$output"
          grep -F 'docker rm dev-agent-ci-home' <<<"$output"
          grep -F 'DEV_DIND=1 DEV_DIND_PERSIST=0 DEV_PODMAN_SECURITY=off run-dev-docker.sh' <<<"$output"
      - name: Build and run a container using the nested daemon
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --env DEV_HOME_VOLUME_INIT=1 \
            --env DEV_DIND=1 \
            --mount type=volume,dst=/var/lib/docker \
            "dev-dotfiles-dind:${{ github.sha }}" \
            -c 'set -euo pipefail; tmp=$(mktemp -d); printf "%s\n" "package main" "func main() {}" > "$tmp/main.go"; CGO_ENABLED=0 go build -o "$tmp/smoke" "$tmp/main.go"; printf "%s\n" "FROM scratch" "COPY smoke /smoke" "ENTRYPOINT [\"/smoke\"]" > "$tmp/Dockerfile"; docker build --pull=false -t dev-dind-smoke "$tmp"; docker run --rm dev-dind-smoke; rm -rf "$tmp"'
