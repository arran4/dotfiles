name: Caelestia ownership

on:
  pull_request:
    paths:
      - '.chezmoiexternal.toml'
      - 'dot_config/caelestia/**'
      - '.github/workflows/caelestia-ownership.yml'
  push:
    branches:
      - main
    paths:
      - '.chezmoiexternal.toml'
      - 'dot_config/caelestia/**'
      - '.github/workflows/caelestia-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package-owned Caelestia shell
        run: |
          set -eu
          if [ -f .chezmoiexternal.toml ] && grep -Fq 'caelestia-dots/shell' .chezmoiexternal.toml; then
            echo 'Caelestia shell must be installed by the system package manager, not as a chezmoi external.' >&2
            exit 1
          fi

      - name: Verify user configuration remains managed
        run: test -f dot_config/caelestia/shell.json.tmpl
