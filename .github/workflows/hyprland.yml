name: Hyprland validation

on:
  pull_request:
    paths:
      - 'dot_config/hypr/**'
      - '.chezmoi.toml.tmpl'
      - '.github/workflows/hyprland.yml'
      - 'dot_local/bin/executable_cliphist-daemon.sh.tmpl'
  push:
    branches:
      - main
    paths:
      - 'dot_config/hypr/**'
      - '.chezmoi.toml.tmpl'
      - '.github/workflows/hyprland.yml'
      - 'dot_local/bin/executable_cliphist-daemon.sh.tmpl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Render dotfiles
        run: |
          yes "" | sh -c "$(curl -fsLS get.chezmoi.io)" -- init --no-tty --debug --source="$PWD" --apply

      - name: Check Hyprland Lua syntax
        run: |
          find "$HOME/.config/hypr" -name '*.lua' -print0 | xargs -0 -r luac5.4 -p

      - name: Validate Hyprland Lua dispatcher API usage
        shell: python
        run: |
          import pathlib
          import re
          import sys

          paths = [
              pathlib.Path('dot_config/hypr/hyprland.lua.tmpl'),
              pathlib.Path('dot_config/hypr/special_workspaces.lua'),
          ]
          sources = {path: path.read_text() for path in paths if path.exists()}

          allowed_top_level = {
              'exec_cmd',
              'focus',
              'global',
              'layout',
              'window',
              'workspace',
          }
          allowed_window = {
              'alter_zorder',
              'close',
              'cycle_next',
              'drag',
              'float',
              'fullscreen',
              'kill',
              'move',
              'resize',
              'signal',
          }
          allowed_workspace = {
              'toggle_special',
          }

          errors = []
          for path, source in sources.items():
              for match in re.finditer(r'hl\.dsp\.layout\.([A-Za-z_]\w*)', source):
                  errors.append(
                      f'{path}:{source.count(chr(10), 0, match.start()) + 1}: '
                      f'invalid nested layout dispatcher hl.dsp.layout.{match.group(1)}; '
                      'use hl.dsp.layout("message")'
                  )

              for namespace, allowed in (
                  ('window', allowed_window),
                  ('workspace', allowed_workspace),
              ):
                  pattern = rf'hl\.dsp\.{namespace}\.([A-Za-z_]\w*)'
                  for match in re.finditer(pattern, source):
                      method = match.group(1)
                      if method not in allowed:
                          errors.append(
                              f'{path}:{source.count(chr(10), 0, match.start()) + 1}: '
                              f'unknown/unreviewed dispatcher hl.dsp.{namespace}.{method}'
                          )

              for match in re.finditer(r'hl\.dsp\.([A-Za-z_]\w*)', source):
                  name = match.group(1)
                  if name not in allowed_top_level:
                      errors.append(
                          f'{path}:{source.count(chr(10), 0, match.start()) + 1}: '
                          f'unknown/unreviewed top-level dispatcher hl.dsp.{name}'
                      )

              forbidden = {
                  'hl.dsp.window.toggle_floating': 'use hl.dsp.window.float({ action = "toggle" })',
                  'hl.dsp.layout.toggle_split': 'use hl.dsp.layout("togglesplit")',
              }
              for token, replacement in forbidden.items():
                  if token in source:
                      errors.append(f'{path}: forbidden {token}; {replacement}')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)

          print('Hyprland Lua dispatcher API usage is valid')

      - name: Verify special workspace module layout
        run: |
          test -f dot_config/hypr/special_workspaces.lua
          test -f "$HOME/.config/hypr/special_workspaces.lua"
          grep -Fq 'pcall(require, "special_workspaces")' dot_config/hypr/hyprland.lua.tmpl
          ! grep -Fq '{{ template "hypr/special_workspaces.lua" . }}' dot_config/hypr/hyprland.lua.tmpl
          ! grep -Fq 'special:anytype' dot_config/hypr/hyprland.lua.tmpl
          ! grep -Fq 'special:anytype' dot_config/hypr/special_workspaces.lua
          grep -Fq 'special:kjules' dot_config/hypr/special_workspaces.lua

      - name: Test special workspace module
        run: |
          lua5.4 - <<'LUA'
          local routes = {}
          local handlers = {}
          local rules = {}
          local workspace_rules = {}
          local binds = {}
          local execs = {}
          local existing = {
            { class = "BeeperTexts", title = "Beeper" },
            { class = "org.kde.konsole", title = "shell" },
            { class = "Spotify", title = "Spotify" },
            { class = "org.kde.kjules", title = "kJules" },
          }

          _G.hl = {
            on = function(event, callback)
              if handlers[event] then
                local old = handlers[event]
                handlers[event] = function(...) old(...); callback(...) end
              else
                handlers[event] = callback
              end
            end,
            get_windows = function()
              return existing
            end,
            window_rule = function(rule)
              table.insert(rules, rule)
            end,
            workspace_rule = function(rule)
              table.insert(workspace_rules, rule)
            end,
            bind = function(keys, action)
              binds[keys] = action
            end,
            exec_cmd = function(...)
              table.insert(execs, {...})
            end,
            dispatch = function(action)
              table.insert(routes, action)
            end,
            dsp = {
              window = {
                move = function(options)
                  return options
                end,
              },
              workspace = {
                toggle_special = function(name)
                  return { special = name }
                end,
              },
            },
          }

          local special = dofile("dot_config/hypr/special_workspaces.lua")
          assert(type(special) == "table")
          assert(type(special.setup) == "function")
          assert(type(special.workspace_for_window) == "function")
          special.setup({ terminal = "/usr/bin/xterm" })

          assert(#rules == 4, "music, Beeper, terminal and kJules static rules should be registered")
          assert(rules[1].workspace == "special:music")
          assert(rules[2].workspace == "special:beeper")
          assert(rules[3].workspace == "special:terminal")
          assert(rules[4].workspace == "special:kjules")
          assert(rules[2].match.class:find("BeeperTexts", 1, true))
          assert(rules[3].match.class:find("org.kde.konsole", 1, true))
          assert(rules[3].match.class:find("footclient", 1, true))
          assert(rules[4].match.class:find("org.kde.kjules", 1, true))

          assert(#workspace_rules == 5, "all five named special workspaces should be persistent")
          local persistent = {}
          for _, rule in ipairs(workspace_rules) do
            persistent[rule.workspace] = true
          end
          assert(persistent["special:music"])
          assert(persistent["special:beeper"])
          assert(persistent["special:terminal"])
          assert(persistent["special:scratchpad"])
          assert(persistent["special:kjules"])
          assert(not persistent["special:anytype"])

          assert(binds["SUPER + M"].special == "music")
          assert(binds["SUPER + B"].special == "beeper")
          assert(binds["SUPER + grave"].special == "terminal")
          assert(binds["SUPER + T"].special == "terminal")
          assert(binds["SUPER + D"].special == "scratchpad")
          assert(binds["SUPER + J"].special == "kjules")

          assert(type(binds["SUPER + SHIFT + J"]) == "function")
          local pre_execs = #execs
          binds["SUPER + SHIFT + J"]()
          assert(#execs == pre_execs + 1)
          assert(execs[#execs][1] == "kjules --new-session")

          assert(special.workspace_for_window({ class = "Beeper" }) == "beeper")
          assert(special.workspace_for_window({ class = "org.kde.konsole" }) == "terminal")
          assert(special.workspace_for_window({ class = "Spotify" }) == "music")
          assert(special.workspace_for_window({ class = "org.kde.kjules" }) == "kjules")
          assert(special.workspace_for_window({ class = "Anytype" }) == nil)
          assert(special.workspace_for_window({ class = "firefox", title = "Beeper - search" }) == nil)

          assert(#routes == 4, "existing routed windows should be reconciled on setup")
          assert(routes[1].workspace == "special:beeper")
          assert(routes[2].workspace == "special:terminal")
          assert(routes[3].workspace == "special:music")
          assert(routes[4].workspace == "special:kjules")
          assert(routes[1].follow == false)
          assert(routes[1].window == existing[1])

          assert(type(handlers["window.open"]) == "function")
          assert(type(handlers["window.class"]) == "function")
          assert(type(handlers["hyprland.start"]) == "function")

          handlers["window.open"]({ class = "xterm", title = "shell" })
          assert(routes[#routes].workspace == "special:terminal")

          handlers["window.class"]({ class = "com.beeper.Beeper", title = "Beeper" })
          assert(routes[#routes].workspace == "special:beeper")

          handlers["window.open"]({ class = "kjules", title = "kJules" })
          assert(routes[#routes].workspace == "special:kjules")

          local before = #routes
          handlers["window.open"]({ class = "Anytype", title = "Anytype" })
          assert(#routes == before, "Anytype must no longer be captured by a special workspace")
          handlers["window.open"]({ class = "firefox", title = "Beeper - search" })
          assert(#routes == before, "ordinary browser windows mentioning Beeper must not be captured")

          local pre_hyprland_execs = #execs
          handlers["hyprland.start"]()
          local hyprland_execs = {}
          for i = pre_hyprland_execs + 1, #execs do
            table.insert(hyprland_execs, execs[i])
          end
          local autostart_count = 0
          local has_term, has_spotify, has_beeper = false, false, false
          for _, cmd in ipairs(hyprland_execs) do
            if type(cmd[2]) == "table" and cmd[2].workspace then
              autostart_count = autostart_count + 1
              if cmd[1] == "/usr/bin/xterm" and cmd[2].workspace == "special:terminal silent" then has_term = true end
              if cmd[1] == "flatpak run com.spotify.Client" and cmd[2].workspace == "special:music silent" then has_spotify = true end
              if cmd[1] == "flatpak run com.beeper.Beeper" and cmd[2].workspace == "special:beeper silent" then has_beeper = true end
            end
          end
          assert(autostart_count == 3, "only terminal, Spotify and Beeper should autostart from special workspace config")
          assert(has_term and has_spotify and has_beeper, "missing expected autostart application")

          print("Hyprland special workspace module tests passed")
          LUA

      - name: Test cliphist daemon script
        run: |
          # Test script with test doubles
          export HYPRLAND_INSTANCE_SIGNATURE="test_instance_$$"
          export XDG_RUNTIME_DIR="/tmp/test_xdg_runtime_$$"
          mkdir -p "$XDG_RUNTIME_DIR"

          mock_bin_dir="/tmp/test_mock_bin_$$"
          mkdir -p "$mock_bin_dir"
          wl_paste_mock="$mock_bin_dir/wl-paste"
          cat << 'MOCK' > "$wl_paste_mock"
          #!/bin/bash
          while true; do sleep 1; done
          MOCK
          chmod +x "$wl_paste_mock"
          export PATH="$mock_bin_dir:$PATH"

          # Test rendering output
          sed -e 's/{{ index . "wlPasteLocation" | default "wl-paste" }}/wl-paste/' \
              -e 's/{{ index . "cliphistLocation" | default "cliphist" }}/cliphist/' \
              dot_local/bin/executable_cliphist-daemon.sh.tmpl > rendered_cliphist.sh
          chmod +x rendered_cliphist.sh

          # Run twice concurrently to test race conditions and double spawn
          ./rendered_cliphist.sh &
          ./rendered_cliphist.sh &
          wait

          PID_DIR="${XDG_RUNTIME_DIR}/wl-paste/$HYPRLAND_INSTANCE_SIGNATURE"

          # Wait to ensure they are up
          sleep 0.5
          pid1=$(cat "$PID_DIR/text.pid")
          pid2=$(cat "$PID_DIR/image.pid")

          if ps -p "$pid1" > /dev/null && ps -p "$pid2" > /dev/null; then
              echo "PIDs are running."
          else
              echo "PIDs are NOT running."
              exit 1
          fi

          # Run again to ensure it kills old ones
          ./rendered_cliphist.sh
          sleep 0.5
          if ps -p "$pid1" > /dev/null || ps -p "$pid2" > /dev/null; then
              echo "Old PIDs were NOT killed."
              exit 1
          else
              echo "Old PIDs were killed successfully."
          fi

          # Test with wrong executable taking over PID
          echo "Testing fake PID takeover"
          pid3=$(cat "$PID_DIR/text.pid")
          kill "$pid3"
          sleep 0.5

          # Spawn a fake process
          bash -c 'while true; do sleep 1; done' &
          fake_pid=$!
          echo "$fake_pid" > "$PID_DIR/text.pid"

          ./rendered_cliphist.sh
          sleep 0.5

          if ps -p "$fake_pid" > /dev/null; then
              echo "Fake PID survived."
          else
              echo "Fake PID was killed! FAIL"
              exit 1
          fi
          kill "$fake_pid"

          # Test disjoint signatures
          export HYPRLAND_INSTANCE_SIGNATURE="test_instance_2_$$"
          ./rendered_cliphist.sh
          sleep 0.5
          PID_DIR2="${XDG_RUNTIME_DIR}/wl-paste/$HYPRLAND_INSTANCE_SIGNATURE"
          pid4=$(cat "$PID_DIR2/text.pid")

          # Restore original signature
          export HYPRLAND_INSTANCE_SIGNATURE="test_instance_$$"
          ./rendered_cliphist.sh
          sleep 0.5

          if ps -p "$pid4" > /dev/null; then
             echo "Disjoint signature process survived"
          else
             echo "Disjoint signature process was killed"
             exit 1
          fi

          rm -rf "$XDG_RUNTIME_DIR" "$mock_bin_dir" rendered_cliphist.sh

      - name: Execute rendered Hyprland config with API mock
        run: |
          lua5.4 - <<'LUA'
          local has_cliphist = false
          local handlers = {}
          local hyprland_execs = {}

          local mock_dsp = setmetatable({}, {
            __index = function(_, key)
              return function(...) return { dsp = key, args = {...} } end
            end,
          })

          local registered_curves = { default = true }

          local function validate_config_keys(tbl, path)
            path = path or ""
            local forbidden_keys = {
              ["dwindle.pseudotile"] = "dwindle.pseudotile is obsolete",
              ["misc.vfr"] = "misc.vfr is obsolete; use debug.vfr",
              ["animations.bezier"] = "animations.bezier is obsolete; use hl.curve",
            }
            for key, value in pairs(tbl) do
              local current = path == "" and tostring(key) or (path .. "." .. tostring(key))
              if forbidden_keys[current] then
                error("Forbidden/obsolete config key: " .. current)
              end
              if type(value) == "table" then
                validate_config_keys(value, current)
              end
            end
          end

          _G.hl = {
            monitor = function(opts) assert(type(opts) == "table") end,
            config = function(opts)
              assert(type(opts) == "table")
              validate_config_keys(opts)
            end,
            env = function(...) end,
            curve = function(name, opts)
              assert(type(name) == "string" and name ~= "")
              assert(type(opts) == "table")
              registered_curves[name] = true
            end,
            animation = function(opts)
              assert(type(opts) == "table")
              if opts.bezier then
                assert(registered_curves[opts.bezier], "unregistered curve " .. tostring(opts.bezier))
              end
            end,
            gesture = function(opts) assert(type(opts) == "table") end,
            bind = function(keys, action, opts)
              assert(type(keys) == "string")
              assert(action ~= nil)
            end,
            window_rule = function(opts) assert(type(opts) == "table") end,
            layer_rule = function(opts) assert(type(opts) == "table") end,
            workspace_rule = function(opts) assert(type(opts) == "table") end,
            dispatch = function(...) end,
            exec_cmd = function(...)
              table.insert(hyprland_execs, {...})
            end,
            get_windows = function() return {} end,
            on = function(event, callback)
              assert(type(event) == "string")
              assert(type(callback) == "function")
              if not handlers[event] then handlers[event] = {} end
              table.insert(handlers[event], callback)
            end,
            dsp = setmetatable({
              window = mock_dsp,
              workspace = mock_dsp,
              layout = function(...) return { dsp = "layout", args = {...} } end,
            }, {
              __index = function(_, key)
                return function(...) return { dsp = key, args = {...} } end
              end,
            }),
          }

          dofile(os.getenv("HOME") .. "/.config/hypr/hyprland.lua")

          if handlers["hyprland.start"] then
            for _, hook in ipairs(handlers["hyprland.start"]) do
              hook()
            end
          end

          for _, cmd in ipairs(hyprland_execs) do
            if cmd[1] == "cliphist-daemon.sh" then has_cliphist = true end
          end
          assert(has_cliphist, "cliphist daemon must be launched by hyprland.start")

          print("Rendered Hyprland config executed successfully with special_workspaces.lua")
          LUA

      - name: Verify missing special workspace module is non-fatal
        run: |
          mv "$HOME/.config/hypr/special_workspaces.lua" "$HOME/.config/hypr/special_workspaces.lua.disabled"

          lua5.4 - <<'LUA'
          local mock_dsp = setmetatable({}, {
            __index = function(_, key)
              return function(...) return { dsp = key, args = {...} } end
            end,
          })

          _G.hl = {
            monitor = function(...) end,
            config = function(...) end,
            env = function(...) end,
            curve = function(...) end,
            animation = function(...) end,
            gesture = function(...) end,
            bind = function(...) end,
            window_rule = function(...) end,
            layer_rule = function(...) end,
            workspace_rule = function(...) end,
            dispatch = function(...) end,
            exec_cmd = function(...) end,
            get_windows = function() return {} end,
            on = function(...) end,
            dsp = setmetatable({
              window = mock_dsp,
              workspace = mock_dsp,
              layout = function(...) return { dsp = "layout", args = {...} } end,
            }, {
              __index = function(_, key)
                return function(...) return { dsp = key, args = {...} } end
              end,
            }),
          }

          dofile(os.getenv("HOME") .. "/.config/hypr/hyprland.lua")
          print("Rendered Hyprland config survives a missing special_workspaces.lua")
          LUA
