# Nested Podman is rootless and local to this development container.
# Keep its graphroot outside the project home and workspace. It survives an
# outer-container recreation only when DEV_PODMAN_PERSIST=1 is enabled.
[storage]
driver = "overlay"
rootless_storage_path = "/var/lib/dev-podman"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
